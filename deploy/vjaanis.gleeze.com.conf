server {
    listen 80; listen [::]:80;
    server_name vjaanis.gleeze.com;
    location /.well-known/acme-challenge/ { root /var/www/_acme; }
    location / { return 301 https://$host$request_uri; }
}
server {
    listen 443 ssl http2; listen [::]:443 ssl http2;
    server_name vjaanis.gleeze.com;
    ssl_certificate     /etc/nginx/certs/vjaanis.gleeze.com/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/vjaanis.gleeze.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    access_log /var/log/nginx/vjaanis.gleeze.com.access.log;
    error_log  /var/log/nginx/vjaanis.gleeze.com.error.log;
    client_max_body_size 50m;

    location /erekins/api/ {
        limit_except GET POST { deny all; }
        proxy_pass http://127.0.0.1:3107/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 100s;
        client_max_body_size 12m;
    }

    location / { root /var/www/vjaanis.gleeze.com; index index.html; try_files $uri $uri/ =404; }
}
